<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Function-row-less keyboard layout</title>
  <desc id="desc">A function-row-less layout with a main typing cluster, separate navigation cluster, and arrow keys.</desc>
  <defs>
    <linearGradient id="case" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#d8d8d5"/><stop offset="1" stop-color="#a7a7a3"/></linearGradient>
    <linearGradient id="key" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fbfbf9"/><stop offset="1" stop-color="#deded9"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#3d3d39" flood-opacity=".42"/></filter>
    <g id="u"><rect width="48" height="48" rx="3"/><rect x="4" y="4" width="40" height="37" rx="2" class="face"/></g>
  </defs>
  <style>
    .case { fill:url(#case); stroke:#777772; stroke-width:3; }
    .key { fill:#bab9b5; stroke:#52524e; stroke-width:1.4; filter:url(#shadow); }
    .key .face { fill:url(#key); stroke:#b5b5af; stroke-width:1; }
    .mod .face { fill:#b7b8b4; }
    .accent .face { fill:#8ca6b5; }
    text { font-family:Arial,Helvetica,sans-serif; font-size:11px; font-weight:700; fill:#363632; text-anchor:middle; dominant-baseline:middle; }
    .small { font-size:9px; }
    .label { fill:#efefeb; font-size:14px; letter-spacing:2px; }
  </style>
  <rect class="case" x="18" y="18" width="1244" height="464" rx="18"/>
  <text class="label" x="70" y="48">FRL</text>
  <g>
    <g class="key mod" transform="translate(70 78)"><rect width="48" height="48" rx="3"/><rect x="4" y="4" width="40" height="37" rx="2" class="face"/><text x="24" y="23">Esc</text></g>
    <g class="key" transform="translate(124 78)"><use href="#u"/></g><g class="key" transform="translate(178 78)"><use href="#u"/></g><g class="key" transform="translate(232 78)"><use href="#u"/></g><g class="key" transform="translate(286 78)"><use href="#u"/></g><g class="key" transform="translate(340 78)"><use href="#u"/></g><g class="key" transform="translate(394 78)"><use href="#u"/></g><g class="key" transform="translate(448 78)"><use href="#u"/></g><g class="key" transform="translate(502 78)"><use href="#u"/></g><g class="key" transform="translate(556 78)"><use href="#u"/></g><g class="key" transform="translate(610 78)"><use href="#u"/></g><g class="key" transform="translate(664 78)"><use href="#u"/></g><g class="key" transform="translate(718 78)"><use href="#u"/></g>
    <g class="key mod" transform="translate(772 78)"><rect width="102" height="48" rx="3"/><rect x="4" y="4" width="94" height="37" rx="2" class="face"/><text x="51" y="23">Backspace</text></g>
    <g class="key mod" transform="translate(70 132)"><rect width="75" height="48" rx="3"/><rect x="4" y="4" width="67" height="37" rx="2" class="face"/><text x="37" y="23">Tab</text></g>
    <g class="key" transform="translate(151 132)"><use href="#u"/></g><g class="key" transform="translate(205 132)"><use href="#u"/></g><g class="key" transform="translate(259 132)"><use href="#u"/></g><g class="key" transform="translate(313 132)"><use href="#u"/></g><g class="key" transform="translate(367 132)"><use href="#u"/></g><g class="key" transform="translate(421 132)"><use href="#u"/></g><g class="key" transform="translate(475 132)"><use href="#u"/></g><g class="key" transform="translate(529 132)"><use href="#u"/></g><g class="key" transform="translate(583 132)"><use href="#u"/></g><g class="key" transform="translate(637 132)"><use href="#u"/></g><g class="key" transform="translate(691 132)"><use href="#u"/></g><g class="key" transform="translate(745 132)"><use href="#u"/></g><g class="key mod" transform="translate(799 132)"><rect width="75" height="48" rx="3"/><rect x="4" y="4" width="67" height="37" rx="2" class="face"/></g>
    <g class="key mod" transform="translate(70 186)"><rect width="88" height="48" rx="3"/><rect x="4" y="4" width="80" height="37" rx="2" class="face"/><text x="44" y="23">Caps</text></g>
    <g class="key" transform="translate(164 186)"><use href="#u"/></g><g class="key" transform="translate(218 186)"><use href="#u"/></g><g class="key" transform="translate(272 186)"><use href="#u"/></g><g class="key" transform="translate(326 186)"><use href="#u"/></g><g class="key" transform="translate(380 186)"><use href="#u"/></g><g class="key" transform="translate(434 186)"><use href="#u"/></g><g class="key" transform="translate(488 186)"><use href="#u"/></g><g class="key" transform="translate(542 186)"><use href="#u"/></g><g class="key" transform="translate(596 186)"><use href="#u"/></g><g class="key" transform="translate(650 186)"><use href="#u"/></g><g class="key" transform="translate(704 186)"><use href="#u"/></g><g class="key mod" transform="translate(758 186)"><rect width="116" height="48" rx="3"/><rect x="4" y="4" width="108" height="37" rx="2" class="face"/><text x="58" y="23">Enter</text></g>
    <g class="key mod" transform="translate(70 240)"><rect width="115" height="48" rx="3"/><rect x="4" y="4" width="107" height="37" rx="2" class="face"/><text x="57" y="23">Shift</text></g>
    <g class="key" transform="translate(191 240)"><use href="#u"/></g><g class="key" transform="translate(245 240)"><use href="#u"/></g><g class="key" transform="translate(299 240)"><use href="#u"/></g><g class="key" transform="translate(353 240)"><use href="#u"/></g><g class="key" transform="translate(407 240)"><use href="#u"/></g><g class="key" transform="translate(461 240)"><use href="#u"/></g><g class="key" transform="translate(515 240)"><use href="#u"/></g><g class="key" transform="translate(569 240)"><use href="#u"/></g><g class="key" transform="translate(623 240)"><use href="#u"/></g><g class="key" transform="translate(677 240)"><use href="#u"/></g><g class="key" transform="translate(731 240)"><use href="#u"/></g><g class="key mod" transform="translate(785 240)"><rect width="89" height="48" rx="3"/><rect x="4" y="4" width="81" height="37" rx="2" class="face"/><text x="44" y="23">Shift</text></g>
    <g class="key mod" transform="translate(70 294)"><rect width="61" height="48" rx="3"/><rect x="4" y="4" width="53" height="37" rx="2" class="face"/><text x="30" y="23">Ctrl</text></g><g class="key mod" transform="translate(137 294)"><use href="#u"/><text x="24" y="23">Win</text></g><g class="key mod" transform="translate(191 294)"><use href="#u"/><text x="24" y="23">Alt</text></g><g class="key" transform="translate(245 294)"><rect width="318" height="48" rx="3"/><rect x="4" y="4" width="310" height="37" rx="2" class="face"/></g><g class="key mod" transform="translate(569 294)"><use href="#u"/><text x="24" y="23">Alt</text></g><g class="key mod" transform="translate(623 294)"><use href="#u"/><text x="24" y="23">Fn</text></g><g class="key mod" transform="translate(677 294)"><use href="#u"/><text x="24" y="23">Win</text></g><g class="key mod" transform="translate(731 294)"><rect width="143" height="48" rx="3"/><rect x="4" y="4" width="135" height="37" rx="2" class="face"/><text x="72" y="23">Ctrl</text></g>
  </g>
  <g class="key mod" transform="translate(948 78)"><use href="#u"/><text x="24" y="23">Ins</text></g><g class="key mod" transform="translate(1002 78)"><use href="#u"/><text x="24" y="23">Home</text></g><g class="key mod" transform="translate(1056 78)"><use href="#u"/><text x="24" y="23">PgUp</text></g>
  <g class="key mod" transform="translate(948 132)"><use href="#u"/><text x="24" y="23">Del</text></g><g class="key mod" transform="translate(1002 132)"><use href="#u"/><text x="24" y="23">End</text></g><g class="key mod" transform="translate(1056 132)"><use href="#u"/><text x="24" y="23">PgDn</text></g>
  <g class="key accent" transform="translate(1002 240)"><use href="#u"/><text x="24" y="23">Up</text></g><g class="key accent" transform="translate(948 294)"><use href="#u"/><text x="24" y="23">Left</text></g><g class="key accent" transform="translate(1002 294)"><use href="#u"/><text x="24" y="23">Down</text></g><g class="key accent" transform="translate(1056 294)"><use href="#u"/><text x="24" y="23">Right</text></g>
  <g fill="#4e4e49" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700"><text x="148" y="102">1</text><text x="202" y="102">2</text><text x="256" y="102">3</text><text x="310" y="102">4</text><text x="364" y="102">5</text><text x="418" y="102">6</text><text x="472" y="102">7</text><text x="526" y="102">8</text><text x="580" y="102">9</text><text x="634" y="102">0</text><text x="175" y="156">Q</text><text x="229" y="156">W</text><text x="283" y="156">E</text><text x="337" y="156">R</text><text x="391" y="156">T</text><text x="445" y="156">Y</text><text x="499" y="156">U</text><text x="553" y="156">I</text><text x="607" y="156">O</text><text x="661" y="156">P</text><text x="188" y="210">A</text><text x="242" y="210">S</text><text x="296" y="210">D</text><text x="350" y="210">F</text><text x="404" y="210">G</text><text x="458" y="210">H</text><text x="512" y="210">J</text><text x="566" y="210">K</text><text x="620" y="210">L</text><text x="215" y="264">Z</text><text x="269" y="264">X</text><text x="323" y="264">C</text><text x="377" y="264">V</text><text x="431" y="264">B</text><text x="485" y="264">N</text><text x="539" y="264">M</text></g>
</svg>
