<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build Gallery</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("keyboardConfigurator.themeVars");
        if (!saved) return;
        Object.entries(JSON.parse(saved)).forEach(([property, value]) => {
          document.documentElement.style.setProperty(property, value);
        });
      } catch (error) {}
    })();
  </script>
  <style>
    :root { --cream:#f7efe1; --paper:#fffaf0; --ink:#2e261f; --muted:#786a5d; --line:rgba(91,71,49,.22); --surface:rgba(255,250,240,.84); --surface-soft:rgba(255,253,247,.74); --red:#da6f5f; --yellow:#e8bd57; --green:#7fb678; --blue:#65a7c8; --violet:#a187c8; --shadow:0 22px 60px rgba(86,57,27,.13); --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--motif-1,linear-gradient(90deg,transparent 0 100%)),var(--motif-2,linear-gradient(90deg,transparent 0 100%)),linear-gradient(115deg,var(--wash-1,rgba(218,111,95,.14)),transparent 24%),linear-gradient(245deg,var(--wash-2,rgba(101,167,200,.18)),transparent 28%),var(--cream); background-size:var(--motif-size-1,auto),var(--motif-size-2,auto),auto,auto,auto; background-attachment:fixed; color:var(--ink); font-family:Aptos,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-feature-settings:"kern" 1,"liga" 1; -webkit-font-smoothing:antialiased; }
    h1, h2, .brand span:last-child { font-family:Aptos,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-optical-sizing:auto; font-weight:850; letter-spacing:0; }
    .page { width:min(1280px,calc(100% - 32px)); margin:0 auto; padding:24px 0 48px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:860; font-size:18px; }
    .mark { width:42px; height:42px; border:1px solid var(--line); background:var(--paper); display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:6px; box-shadow:0 8px 20px rgba(88,60,30,.12); }
    .mark i{display:block;border-radius:4px;} .mark i:nth-child(1){background:var(--red);} .mark i:nth-child(2){background:var(--yellow);} .mark i:nth-child(3){background:var(--green);} .mark i:nth-child(4){background:var(--blue);}
    .nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;} .nav a,.brand a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:820;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-soft);}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .rainbow-rule{height:8px;display:grid;grid-template-columns:1.2fr .8fr 1fr .7fr .9fr;} .rainbow-rule span:nth-child(1){background:var(--red);} .rainbow-rule span:nth-child(2){background:var(--yellow);} .rainbow-rule span:nth-child(3){background:var(--green);} .rainbow-rule span:nth-child(4){background:var(--blue);} .rainbow-rule span:nth-child(5){background:var(--violet);}
    .content{padding:22px;} h1{margin:0 0 8px;font-size:clamp(30px,4.4vw,52px);line-height:1.02;} p{color:var(--muted);line-height:1.45;max-width:780px;}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-top:22px;}
    .build-card{border:1px solid rgba(91,71,49,.16);background:var(--surface-soft);border-radius:7px;overflow:hidden;display:grid;grid-template-rows:230px auto;min-height:390px;}
    .build-hero{border:0;padding:0;background:transparent;cursor:zoom-in;display:block;width:100%;height:100%;}
    .build-hero img{width:100%;height:100%;object-fit:cover;display:block;background:#252525;transition:transform .22s ease, filter .22s ease;}
    .build-hero:hover img{transform:scale(1.025);filter:saturate(1.04) contrast(1.02);}
    .build-copy{padding:13px 14px 15px;display:grid;gap:10px;}
    .build-copy strong{display:block;font-size:15px;line-height:1.28;}
    .build-copy span,.build-copy small{display:block;color:var(--muted);font-size:12px;line-height:1.35;}
    .variant-list{display:grid;gap:7px;margin:0;padding:0;list-style:none;}
    .variant-button{width:100%;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:9px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.36);color:var(--ink);padding:6px;cursor:pointer;text-align:left;}
    .variant-button[aria-current="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--yellow) 55%,transparent);}
    .variant-button img{width:42px;height:34px;object-fit:cover;border-radius:5px;background:#252525;}
    .variant-button b{font-size:12px;line-height:1.2;}
    .variant-button em{font-style:normal;color:var(--muted);font-size:11px;font-weight:800;}
    dialog{width:min(1120px,calc(100% - 28px));border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);padding:0;}
    dialog::backdrop{background:rgba(20,18,15,.62);backdrop-filter:blur(3px);}
    .lightbox-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
    .lightbox-head strong{font-size:14px;} .close{border:1px solid var(--line);border-radius:6px;background:var(--surface-soft);color:var(--ink);font-weight:840;padding:7px 10px;cursor:pointer;}
    .lightbox-img{width:100%;max-height:78vh;object-fit:contain;display:block;background:#1f1e1c;}
    @media (max-width:700px){.page{width:min(100% - 20px,1280px);padding-top:12px}.topbar{display:grid}.nav{justify-content:flex-start}.content{padding:16px}.gallery{grid-template-columns:1fr}.build-card{grid-template-rows:190px auto;}}
  </style>
  <link rel="stylesheet" href="shared-page.css?v=10">
  <script src="shared-theme.js?v=10" defer></script>
</head>
<body class="reference-shell">
  <main class="page">
    <header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Build Gallery</span><a href="changelog.html">Changelog</a></div><nav class="nav" aria-label="Reference pages"><a href="../index.html">Configurator</a><a href="layouts.html">Layouts</a><a href="profiles.html">Profiles</a><a href="colorways.html">Keycaps/Colorways</a><a href="builds.html">Builds</a></nav></header>
    <section class="panel"><div class="rainbow-rule" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><div class="content">
      <h1>Personal Build Gallery</h1>
      <p>A visual library of completed builds from the reference folder. Each card is grouped by board, with alternate photos and configurations batched together.</p>
      <div class="gallery" id="gallery" aria-label="Keyboard build gallery"></div>
    </div></section>
  </main>
  <dialog id="lightbox" aria-label="Build image preview">
    <div class="lightbox-head"><strong id="lightboxTitle"></strong><button class="close" id="closeLightbox" type="button">Close</button></div>
    <img class="lightbox-img" id="lightboxImage" alt="">
  </dialog>
  <script>
    const buildGroups = [
      { board: "Akko ACR Top75 Pro", layout: "75%", variants: [
        { config: "Google IFK", file: "Akko ACR Top75 Pro with Google IFK.jpg" }
      ] },
      { board: "Akko Mod007HE", layout: "75% / Hall Effect", variants: [
        { config: "EPBT Esper", file: "Akko Mod007HE with EPBT Esper.jpg" }
      ] },
      { board: "AV4 Soul", layout: "65%", variants: [
        { config: "GMK Panels", file: "Av4 Soul with GMK Panels.jpg" },
        { config: "MTNU Modo", file: "AV4 Soul with MTNU Modo.jpg" }
      ] },
      { board: "Classic TKL", layout: "TKL", variants: [
        { config: "Pelô", file: "Classic TKL with Pelô.jpg" }
      ] },
      { board: "DaringRun 70-F", layout: "70% / FRL", variants: [
        { config: "KKB Boundless Jataka", file: "DaringRun 70-F with KKB Boundless Jataka.jpg" }
      ] },
      { board: "DaringRun PG-7", layout: "Compact / 7u", variants: [
        { config: "GMK Botanical", file: "DaringRun PG-7 with GMK Botanical.jpg" },
        { config: "PBTfans Absolute", file: "DaringRun PG-7 with PBTfans Absolute.jpg" },
        { config: "PBTfans Absolute, second angle", file: "DaringRun PG-7 with PBTfans Absolute 2.jpg" }
      ] },
      { board: "Dolice", layout: "Alice", variants: [
        { config: "KAP Santa Llum", file: "Dolice with KAP Santa Llum.jpg" },
        { config: "KAP Santa Llum, second angle", file: "Dolice with KAP Santa Llum 2.jpg" }
      ] },
      { board: "Evo80", layout: "TKL / 80%", variants: [
        { config: "DCX RockyBird", file: "Evo80 with DCX RockyBird.jpg" }
      ] },
      { board: "Geon Frog TKL 8k", layout: "TKL / 80%", variants: [
        { config: "PBTfans Absolute", file: "Geon Frog TKL with PBTFans Absolute.jpg" },
        { config: "PBTfans Absolute, top angle", file: "2627d614-b25a-477f-9c21-6de1dd9bd741.jpg" },
        { config: "PBTfans Absolute, detail angle", file: "5269ea57-a480-4485-9ba5-94e1ca718822.jpg" }
      ] },
      { board: "Hola 40%", layout: "40% + numpad", variants: [
        { config: "GMK Motif", file: "Hola 40% with numpad and GMK Motif.jpg" }
      ] },
      { board: "Iconlabs Tree80", layout: "TKL / 80%", variants: [
        { config: "DCD Flower Journal", file: "Iconlabs Tree80 with DCD Flower Journal.jpg" }
      ] },
      { board: "Keychron Q5 Max", layout: "96% / 1800", variants: [
        { config: "GMK Pixel", file: "Keychron Q5 Max with GMK Pixel.jpg" }
      ] },
      { board: "Keebfront Vanguard65", layout: "65% / macro", variants: [
        { config: "GMK Tuzi", file: "Keebfront Vanguard65 with GMK Tuzi.jpg" },
        { config: "GMK Tuzi, right detail", file: "Media (2).jpg" },
        { config: "GMK Tuzi, left detail", file: "Media (3).jpg" }
      ] },
      { board: "Luminkey98 v2", layout: "98%", variants: [
        { config: "GMK Tuzi", file: "Luminkey98 v2 with GMK Tuzi.jpg" }
      ] },
      { board: "Pangea Fullsize", layout: "Fullsize", variants: [
        { config: "KAT Mizu", file: "Pangea Fullsize with KAT Mizu.jpg" },
        { config: "Weight detail", file: "Pangea Fullsize Weight.jpg" },
        { config: "GMK 8008 Bloo", file: "Pangea Fullsize with GMK 8008 Bloo.jpg" }
      ] },
      { board: "PT750", layout: "75%", variants: [
        { config: "MT3 2048", file: "PT750 with MT3 2048.jpg" }
      ] },
      { board: "Savage65", layout: "65%", variants: [
        { config: "Etching detail 1", file: "Savage65 Etching 1.jpg" },
        { config: "Etching detail 2", file: "Savage65 Etching 2.jpg" },
        { config: "Custom etching angle 1", file: "Savage65 with Custom Etching 1.jpg" },
        { config: "Custom etching angle 2", file: "Savage65 with Custom Etching 2.jpg" }
      ] },
      { board: "Teton78", layout: "75% / 78-key", variants: [
        { config: "KKB Great Barrier Reef", file: "Teton78 with KKB Great Barrier Reef.jpg" }
      ] }
    ];

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxTitle = document.getElementById("lightboxTitle");
    const lightboxImage = document.getElementById("lightboxImage");

    function titleForVariant(group, variant) {
      return `${group.board} - ${variant.config}`;
    }

    function imagePath(file) {
      return encodeURI(`../Reference Library/Builds/${file}`);
    }

    gallery.innerHTML = buildGroups.map((group, groupIndex) => {
      const primary = group.variants[0];
      const title = titleForVariant(group, primary);
      const src = imagePath(primary.file);
      const variants = group.variants.map((variant, variantIndex) => {
        const variantTitle = titleForVariant(group, variant);
        const variantSrc = imagePath(variant.file);
        return `<li><button class="variant-button" type="button" data-group="${groupIndex}" data-src="${variantSrc}" data-title="${variantTitle}" aria-current="${variantIndex === 0 ? "true" : "false"}"><img src="${variantSrc}" alt="" loading="lazy" decoding="async"><b>${variant.config}</b><em>${variantIndex + 1}/${group.variants.length}</em></button></li>`;
      }).join("");
      return `<article class="build-card" data-group="${groupIndex}"><button class="build-hero" type="button" data-src="${src}" data-title="${title}" aria-label="Open ${title}"><img src="${src}" alt="${title}" loading="lazy" decoding="async"></button><div class="build-copy"><div><strong>${group.board}</strong><span>${group.layout} / ${group.variants.length} ${group.variants.length === 1 ? "configuration" : "configurations"}</span></div><ul class="variant-list">${variants}</ul><small>Reference Library / Builds</small></div></article>`;
    }).join("");

    gallery.addEventListener("click", (event) => {
      const variantButton = event.target.closest(".variant-button");
      if (variantButton) {
        const card = variantButton.closest(".build-card");
        const hero = card.querySelector(".build-hero");
        const heroImage = hero.querySelector("img");
        card.querySelectorAll(".variant-button").forEach(button => button.setAttribute("aria-current", "false"));
        variantButton.setAttribute("aria-current", "true");
        hero.dataset.src = variantButton.dataset.src;
        hero.dataset.title = variantButton.dataset.title;
        hero.setAttribute("aria-label", `Open ${variantButton.dataset.title}`);
        heroImage.src = variantButton.dataset.src;
        heroImage.alt = variantButton.dataset.title;
        return;
      }
      const button = event.target.closest(".build-hero[data-src]");
      if (!button) return;
      lightboxTitle.textContent = button.dataset.title;
      lightboxImage.src = button.dataset.src;
      lightboxImage.alt = button.dataset.title;
      if (typeof lightbox.showModal === "function") lightbox.showModal();
    });

    document.getElementById("closeLightbox").addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>
</body>
</html>
