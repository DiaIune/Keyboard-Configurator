<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("keyboardConfigurator.themeVars");
        if (!saved) return;
        Object.entries(JSON.parse(saved)).forEach(([property, value]) => {
          document.documentElement.style.setProperty(property, value);
        });
      } catch (error) {}
    })();
  </script>
  <style>
    :root { --cream:#f7efe1; --paper:#fffaf0; --ink:#2e261f; --muted:#786a5d; --line:rgba(91,71,49,.22); --surface:rgba(255,250,240,.84); --surface-soft:rgba(255,253,247,.74); --red:#da6f5f; --yellow:#e8bd57; --green:#7fb678; --blue:#65a7c8; --violet:#a187c8; --shadow:0 22px 60px rgba(86,57,27,.13); --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--motif-1,linear-gradient(90deg,transparent 0 100%)),var(--motif-2,linear-gradient(90deg,transparent 0 100%)),linear-gradient(115deg,var(--wash-1,rgba(218,111,95,.14)),transparent 24%),linear-gradient(245deg,var(--wash-2,rgba(101,167,200,.18)),transparent 28%),var(--cream); background-size:var(--motif-size-1,auto),var(--motif-size-2,auto),auto,auto,auto; background-attachment:fixed; color:var(--ink); font-family:"Plus Jakarta Sans",Aptos,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-feature-settings:"kern" 1,"liga" 1; -webkit-font-smoothing:antialiased; }
    h1, h2, .brand span:last-child { font-family:"Fraunces","Plus Jakarta Sans",Aptos,serif; font-optical-sizing:auto; font-weight:850; letter-spacing:0; }
    .page { width:min(1280px,calc(100% - 32px)); margin:0 auto; padding:24px 0 48px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:860; font-size:18px; }
    .mark { width:42px; height:42px; border:1px solid var(--line); background:var(--paper); display:grid; grid-template-columns:repeat(2,1fr); gap:4px; padding:6px; box-shadow:0 8px 20px rgba(88,60,30,.12); }
    .mark i{display:block;border-radius:4px;} .mark i:nth-child(1){background:var(--red);} .mark i:nth-child(2){background:var(--yellow);} .mark i:nth-child(3){background:var(--green);} .mark i:nth-child(4){background:var(--blue);}
    .nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;} .nav a,.brand a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:820;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-soft);}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .rainbow-rule{height:8px;display:grid;grid-template-columns:1.2fr .8fr 1fr .7fr .9fr;} .rainbow-rule span:nth-child(1){background:var(--red);} .rainbow-rule span:nth-child(2){background:var(--yellow);} .rainbow-rule span:nth-child(3){background:var(--green);} .rainbow-rule span:nth-child(4){background:var(--blue);} .rainbow-rule span:nth-child(5){background:var(--violet);}
    .content{padding:22px;} h1{margin:0 0 8px;font-size:clamp(30px,4.4vw,52px);line-height:1.02;} p{color:var(--muted);line-height:1.45;max-width:780px;}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:22px;}
    .build-card{border:1px solid rgba(91,71,49,.16);background:var(--surface-soft);border-radius:7px;overflow:hidden;display:grid;grid-template-rows:220px auto;min-height:300px;}
    .build-card button{border:0;padding:0;background:transparent;cursor:zoom-in;display:block;width:100%;height:100%;}
    .build-card img{width:100%;height:100%;object-fit:cover;display:block;background:#252525;transition:transform .22s ease, filter .22s ease;}
    .build-card button:hover img{transform:scale(1.025);filter:saturate(1.04) contrast(1.02);}
    .build-copy{padding:13px 14px 15px;} .build-copy strong{display:block;font-size:14px;line-height:1.28;} .build-copy span{display:block;margin-top:6px;color:var(--muted);font-size:12px;}
    dialog{width:min(1120px,calc(100% - 28px));border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);padding:0;}
    dialog::backdrop{background:rgba(20,18,15,.62);backdrop-filter:blur(3px);}
    .lightbox-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
    .lightbox-head strong{font-size:14px;} .close{border:1px solid var(--line);border-radius:6px;background:var(--surface-soft);color:var(--ink);font-weight:840;padding:7px 10px;cursor:pointer;}
    .lightbox-img{width:100%;max-height:78vh;object-fit:contain;display:block;background:#1f1e1c;}
    @media (max-width:700px){.page{width:min(100% - 20px,1280px);padding-top:12px}.topbar{display:grid}.nav{justify-content:flex-start}.content{padding:16px}.build-card{grid-template-rows:190px auto;}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Build Gallery</span><a href="../index.html">Configurator</a></div><nav class="nav" aria-label="Reference pages"><a href="layouts.html">Layouts</a><a href="colorways.html">Colorways</a><a href="profiles.html">Profiles</a><a href="keycaps.html">Keycaps</a><a href="boards.html">Boards</a><a href="changelog.html">Changelog</a></nav></header>
    <section class="panel"><div class="rainbow-rule" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><div class="content">
      <h1>Personal Build Gallery</h1>
      <p>A visual library of completed builds from the reference folder. Click any build to view it larger.</p>
      <div class="gallery" id="gallery" aria-label="Keyboard build gallery"></div>
    </div></section>
  </main>
  <dialog id="lightbox" aria-label="Build image preview">
    <div class="lightbox-head"><strong id="lightboxTitle"></strong><button class="close" id="closeLightbox" type="button">Close</button></div>
    <img class="lightbox-img" id="lightboxImage" alt="">
  </dialog>
  <script>
    const builds = [
      "Akko ACR Top75 Pro with Google IFK.jpg",
      "Akko Mod007HE with EPBT Esper.jpg",
      "Av4 Soul with GMK Panels.jpg",
      "AV4 Soul with MTNU Modo.jpg",
      "Classic TKL with Pel\u00f4.jpg",
      "DaringRun 70-F with KKB Boundless Jataka.jpg",
      "DaringRun PG-7 with GMK Botanical.jpg",
      "Dolice with KAP Santa Llum 2.jpg",
      "Dolice with KAP Santa Llum.jpg",
      "Evo80 with DCX RockyBird.jpg",
      "Hola 40% with numpad and GMK Motif.jpg",
      "Iconlabs Tree80 with DCD Flower Journal.jpg",
      "Keychron Q5 Max with GMK Pixel.jpg",
      "Luminkey98 v2 with GMK Tuzi.jpg",
      "Pangea Fullsize Weight.jpg",
      "Pangea Fullsize with GMK 8008 Bloo.jpg",
      "Pangea Fullsize with KAT Mizu.jpg",
      "PT750 with MT3 2048.jpg",
      "Savage65 Etching 1.jpg",
      "Savage65 Etching 2.jpg",
      "Savage65 with Custom Etching 1.jpg",
      "Savage65 with Custom Etching 2.jpg",
      "Teton78 with KKB Great Barrier Reef.jpg"
    ];

    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lightboxTitle = document.getElementById("lightboxTitle");
    const lightboxImage = document.getElementById("lightboxImage");

    function titleFromFile(file) {
      return file.replace(/\.[^.]+$/, "");
    }

    function imagePath(file) {
      return encodeURI(`../Reference Library/Builds/${file}`);
    }

    gallery.innerHTML = builds.map((file) => {
      const title = titleFromFile(file);
      const src = imagePath(file);
      return `<article class="build-card"><button type="button" data-src="${src}" data-title="${title}" aria-label="Open ${title}"><img src="${src}" alt="${title}" loading="lazy"></button><div class="build-copy"><strong>${title}</strong><span>Reference Library / Builds</span></div></article>`;
    }).join("");

    gallery.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-src]");
      if (!button) return;
      lightboxTitle.textContent = button.dataset.title;
      lightboxImage.src = button.dataset.src;
      lightboxImage.alt = button.dataset.title;
      if (typeof lightbox.showModal === "function") lightbox.showModal();
    });

    document.getElementById("closeLightbox").addEventListener("click", () => lightbox.close());
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) lightbox.close();
    });
  </script>
</body>
</html>
